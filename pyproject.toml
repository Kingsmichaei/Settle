[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "settle"
version = "0.1.0"
description = "Guest-to-host payments engine for rental marketplaces: holds guest funds, pays hosts worldwide, and never loses or double-moves a cent."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oyakhire Michael Kingsley" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
settle = "settle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"settle.ai" = ["prompts/*.md", "evals/*.json"]
"settle.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:settle.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0913", # services take explicit collaborators by design
    "PLR2004", # magic numbers are fine in tests
    "N818",    # domain errors read better as NotFound / InvalidTransition than *Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0917"]  # pytest injects fixtures positionally
"src/settle/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["settle"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]  # APScheduler 3.x ships no type hints
ignore_missing_imports = true
